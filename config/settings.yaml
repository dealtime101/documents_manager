# Documents Manager: settings that come with the program. The FOLDERS (inbox, library, quarantine, database) are chosen in the
# Settings screen and kept in your own folder (see README), not here. Anything written in your own settings.yaml wins over this file.
---
thresholds:
  auto: 0.95      # >= : automatic filing
  confirm: 0.80   # >= : confirmation requested; below: manual validation

backup:           # `manage.py backup` (see deploy/docflow-backup.timer); dir = where to write the dated backups
  keep: 14        # how many dated backups to keep

ocr:
  enabled: true
  languages: "fra+eng"          # Tesseract language packs, e.g. "eng" or "deu+eng"
  min_chars_per_page: 30        # fewer than this = image page -> OCR
  min_chars_scanned_page: 200   # a page that is one big image with fewer characters than this (a stamp, a header) is read by OCR too
  tesseract: "tesseract"        # full path if not in the PATH

ollama:
  enabled: false                # never without --ollama
  model: "qwen2.5:3b-instruct-q4_K_M"
  host: "http://127.0.0.1:11434"   # only localhost is accepted
